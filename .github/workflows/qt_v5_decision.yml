name: QT V5 on-policy Leduc decision audit

on:
  push:
    branches: [research/qt-v5-evidence-gated-2026-10-14]
    paths: [.github/workflows/qt_v5_decision.yml]
  workflow_dispatch:

jobs:
  utility:
    strategy:
      fail-fast: false
      matrix:
        scenario: [stationary_calling, switch_calling_aggressive, heldout_rank_selective]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m pip install -e .
      - name: Paired exact conditional expected payoff and risk certificate
        run: |
          python3 -m pokerlab.qt_v5_decision --scenario ${{ matrix.scenario }} --hands 12 --replicates 8 --seed 20261018 --output qt-v5-utility-${{ matrix.scenario }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: qt-v5-utility-${{ matrix.scenario }}
          path: qt-v5-utility-${{ matrix.scenario }}.json
          retention-days: 45
