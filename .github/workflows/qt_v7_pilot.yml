name: QT V7 long-horizon pilot

on:
  push:
    branches: [research/qt-v7-long-horizon-information-2026-10-14]
    paths: [.github/workflows/qt_v7_pilot.yml]
  workflow_dispatch:

jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        scenario: [stationary_calling, switch_calling_aggressive]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m pip install -e .
      - name: Paired on-policy adaptive Leduc pilot
        run: |
          python3 -m pokerlab.qt_v7_longhorizon --scenario ${{ matrix.scenario }} --hands 24 --replicates 4 --seed 20261026 --output qt-v7-pilot-${{ matrix.scenario }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: qt-v7-pilot-${{ matrix.scenario }}
          path: qt-v7-pilot-${{ matrix.scenario }}.json
          retention-days: 45
