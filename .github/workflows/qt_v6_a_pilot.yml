name: QT V6 changepoint pilot

on:
  push:
    branches: [research/qt-v6-changepoint-riskfrontier-2026-10-14]
    paths: [.github/workflows/qt_v6_a_pilot.yml]
  workflow_dispatch:

jobs:
  changepoint-pilot:
    strategy:
      fail-fast: false
      matrix:
        scenario: [stationary_calling, stationary_aggressive, switch_calling_aggressive, switch_aggressive_calling, switch_early, heldout_rank_selective, heldout_pressure_reactive]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m pip install -e .
      - name: Paired V6 changepoint pilot
        run: |
          python3 -m pokerlab.qt_v6_changepoint_eval --scenario ${{ matrix.scenario }} --hands 24 --replicates 12 --seed 20261018 --output qt-v6-a-pilot-${{ matrix.scenario }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: qt-v6-a-pilot-${{ matrix.scenario }}
          path: qt-v6-a-pilot-${{ matrix.scenario }}.json
          retention-days: 45
