name: V-Lab audit

on:
  push:
    branches:
      - vlab-audit-2026-10-03
  workflow_dispatch:

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  artifact-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Regenerate CFR reference strategy
        run: |
          python -m pokerlab.cfr --iterations 300 --output /tmp/strategy.json
          cmp strategy.json /tmp/strategy.json
      - name: Revalidate committed follow-up records
        run: |
          python -m pokerlab.followup --output /tmp/FOLLOWUP.md
          cmp FOLLOWUP.md /tmp/FOLLOWUP.md
      - name: Validate historical pilot records
        run: python -m pokerlab.report --output /tmp/REPORT.md
      - name: Independent Monte Carlo path check
        run: python -m pokerlab.validate --player0 baseline --player1 calling --hands 20000 --seed 7
      - name: Rerun one held-out condition exactly
        run: |
          python -m pokerlab.experiment --opponent rank_selective --hands 12 --replicates 24 --seed 20261001 --output /tmp/followup-rank_selective.json
          cmp results/followup-rank_selective.json /tmp/followup-rank_selective.json
