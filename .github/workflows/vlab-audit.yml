name: V-Lab audit

on:
  push:
    branches:
      - vlab-audit-2026-10-03
  workflow_dispatch:

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python version
        run: python --version
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
