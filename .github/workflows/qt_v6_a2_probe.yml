name: QT V6 A2 active probing and observability

on:
  push:
    branches: [research/qt-v6-changepoint-riskfrontier-2026-10-14]
    paths: [.github/workflows/qt_v6_a2_probe.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m pip install -e .
      - name: Independent fresh-seed probing and type-identifiability audit
        run: |
          python3 -m pokerlab.qt_v6_observability --seed 20261022 --replicates 24 --hands 48 --output qt-v6-a2-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: qt-v6-a2-probe
          path: qt-v6-a2-probe.json
          retention-days: 45
